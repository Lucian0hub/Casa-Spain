<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa-Espanja</title>
  <meta name="description" content="A family house in Northern Spain, about 50 minutes from Santander. Check availability and send a booking request.">
  <link rel="preload" as="image" href="photos/house-front.jpg">
  <link rel="stylesheet" href="styles.css?v=202611121150">
  <script src="config.js?v=202611121150"></script>
  <script src="lang.js?v=202611121150"></script>
</head>
<body>
  <div class="langs" id="langs">
    <button data-lang="nl">NL</button>
    <button data-lang="en">EN</button>
    <button data-lang="es">ES</button>
  </div>

  <header class="hero" id="top">
    <div class="hero-img" id="heroImg"></div>
    <div class="hero-text">
      <p class="eyebrow" data-t="region"></p>
      <h1 data-house="name"></h1>
      <p class="tagline" data-t="tagline"></p>
      <a class="btn" href="#availability" data-t="checkAvailability"></a>
    </div>
  </header>

  <nav class="nav">
    <a href="#house" data-t="navHouse"></a>
    <a href="#photos" data-t="navPhotos"></a>
    <a href="#surroundings" data-t="navSurroundings"></a>
    <a href="#availability" data-t="navAvailability"></a>
  </nav>

  <main>
    <section id="house" class="wrap">
      <h2 data-t="houseTitle"></h2>
      <ul class="facts" id="facts"></ul>
      <p data-t="houseText"></p>
      <div class="two-col">
        <div>
          <h3 data-t="haveTitle"></h3>
          <ul class="list" data-list="have"></ul>
        </div>
        <div>
          <h3 data-t="knowTitle"></h3>
          <ul class="list" data-list="know"></ul>
        </div>
      </div>
    </section>

    <section id="photos" class="wrap">
      <h2 data-t="photosTitle"></h2>
      <p class="muted" data-t="photosNote"></p>
      <div class="gallery" id="gallery-house"></div>
    </section>

    <section id="surroundings" class="band">
      <div class="wrap">
        <h2 data-t="surrTitle"></h2>
        <p data-t="distance"></p>
        <p data-t="surrText"></p>
        <ul class="distances">
          <li><strong data-t="dSantander"></strong><span>50 min</span></li>
          <li><strong data-t="dRiver"></strong><span>50 m</span></li>
          <li><strong data-t="dBeach"></strong><span>[?] min</span></li>
          <li><strong data-t="dShop"></strong><span>[?] min</span></li>
        </ul>
        <div class="gallery" id="gallery-surroundings"></div>
      </div>
    </section>

    <section id="availability" class="wrap">
      <h2 data-t="availTitle"></h2>
      <p class="muted"><span data-t="availNote"></span> <span id="updated"></span></p>
      <div class="cal-controls">
        <button class="icon-btn" id="prev">&#8249;</button>
        <button class="icon-btn" id="next">&#8250;</button>
      </div>
      <div class="calendars" id="calendars"></div>
      <div class="legend">
        <span><i class="sw free"></i><span data-t="free"></span></span>
        <span><i class="sw booked"></i><span data-t="taken"></span></span>
        <span><i class="sw sel"></i><span data-t="yourDates"></span></span>
      </div>

      <form class="request" id="request">
        <h3 data-t="requestTitle"></h3>
        <p class="selection" id="selection"></p>
        <div class="fields">
          <label><span data-t="yourName"></span><input name="name" required></label>
          <label><span data-t="guests"></span><input name="guests" type="number" min="1" value="2" required></label>
        </div>
        <label><span data-t="message"></span><textarea name="message" rows="3"></textarea></label>
        <button class="btn" type="submit" data-t="send"></button>
        <p class="muted small" data-t="sendNote"></p>
      </form>
    </section>
  </main>

  <footer class="wrap footer">
    <p><span data-house="name"></span> · <span data-t="region"></span></p>
    <p><a id="mailLink" href="#"></a></p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn close" id="lbClose">&times;</button>
    <button class="icon-btn lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <img id="lbImg" alt="">
    <button class="icon-btn lb-nav lb-next" id="lbNext">&#8250;</button>
    <p id="lbCap"></p>
  </div>

  <script src="script.js?v=202611121150"></script>
</body>
</html>
